<script>
"use strict";

/* Your Supabase project settings */
const SUPABASE_URL = "https://vgeqdnxlejtbzorlioqr.supabase.co";
const SUPABASE_KEY = "sb_publishable_T0ExSgteSL_AfTHd854rlg_AqgpSD0Q";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
const categories = ["marketing","farmers","equipment","irrigation","records"];

const $ = id => document.getElementById(id);

function go(id){
  $(id).scrollIntoView({behavior:"smooth"});
}

async function connect(){
  try{
    let {data:{session},error} = await db.auth.getSession();
    if(error) throw error;

    if(!session){
      const result = await db.auth.signInAnonymously();
      if(result.error) throw result.error;
      session = result.data.session;
    }

    currentUser = session.user;
    $("connection").textContent = "🟢 Supabase Connected";
    await loadAll();
  }catch(error){
    $("connection").textContent = "🔴 Connection error: "+error.message;
    console.error(error);
  }
}

async function addItem(event,category){
  event.preventDefault();
  if(!currentUser){
    alert("Database connection is not ready. Please reload.");
    return;
  }

  const forms = {
    marketing:{
      crop:$("marketCrop").value.trim(),
      quantity:$("marketQuantity").value,
      price:$("marketPrice").value,
      village:$("marketVillage").value.trim()
    },
    farmers:{
      name:$("farmerName").value.trim(),
      village:$("farmerVillage").value.trim(),
      district:$("farmerDistrict").value.trim()
    },
    equipment:{
      name:$("equipmentName").value.trim(),
      action:$("equipmentAction").value,
      price:$("equipmentPrice").value,
      village:$("equipmentVillage").value.trim()
    },
    irrigation:{
      crop:$("irrigationCrop").value.trim(),
      stage:$("irrigationStage").value.trim(),
      notes:$("irrigationNotes").value.trim()
    },
    records:{
      type:$("recordType").value,
      description:$("recordTitle").value.trim(),
      amount:$("recordAmount").value
    }
  };

  try{
    const {error} = await db.from("farm_items").insert({
      user_id:currentUser.id,
      category:category,
      data:forms[category]
    });
    if(error) throw error;
    event.target.reset();
    await loadAll();
    alert("Saved successfully!");
  }catch(error){
    alert("Save failed: "+error.message);
  }
}

async function loadCategory(category){
  const {data,error} = await db.from("farm_items")
    .select("id,category,data,created_at")
    .eq("user_id",currentUser.id)
    .eq("category",category)
    .order("created_at",{ascending:false});

  if(error) throw error;

  const target = {
    marketing:"marketingList",
    farmers:"farmersList",
    equipment:"equipmentList",
    irrigation:"irrigationList",
    records:"recordsList"
  }[category];

  const box = $(target);
  box.replaceChildren();

  data.forEach(item=>{
    const card = document.createElement("div");
    card.className = "result";
    const details = document.createElement("p");
    details.textContent = Object.entries(item.data)
      .map(([k,v])=>k+": "+v).join(" | ");
